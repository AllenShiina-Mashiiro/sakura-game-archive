name: v2.6 PostgreSQL validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [v2.6-dev]
permissions:
  contents: read
concurrency:
  group: v2.6-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: sakura_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sakura_game_archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakura_admin -d sakura_game_archive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile metadata for the v2.6 dependency set
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://sakura_admin:ci-only-password@localhost:5432/sakura_game_archive
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://sakura_admin:ci-only-password@localhost:5432/sakura_game_archive
          SESSION_SECRET: ci-only-placeholder-session-secret-32chars
          ADMIN_PASSWORD: ci-only-admin-password
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SMTP_HOST: ""
          SMTP_USER: ""
          SMTP_PASSWORD: ""
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          GITHUB_CLIENT_ID: ""
          GITHUB_CLIENT_SECRET: ""
